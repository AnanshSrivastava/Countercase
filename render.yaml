# NOT READY FOR REAL SELLER OR PAYPAL DATA: this blueprint is untested and the app has no
# authentication or access controls. Do not populate it with any real seller or processor data.
# Demo tools and PayPal credentials are intentionally disabled/omitted here.
databases:
  - name: countercase-db
    plan: free
services:
  - type: web
    name: countercase-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile.prod
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: countercase-db, property: connectionString }
      - key: WEB_ORIGIN
        sync: false
      - { key: CUSTOMER_HASH_SALT, generateValue: true }
      - { key: LLM_API_KEY, sync: false }
      - { key: LLM_MODEL_DRAFT, value: claude-sonnet-5-5 }
      - { key: UPLOAD_DIR, value: /tmp/uploads }
      - { key: DEMO_TOOLS, value: "0" }
      - { key: DISPUTE_SOURCE, value: core }
  - type: web
    name: countercase-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile.prod
    dockerContext: ./apps/web
    envVars:
      - { key: NEXT_PUBLIC_API_URL, sync: false }
      - { key: API_INTERNAL_URL, sync: false }
